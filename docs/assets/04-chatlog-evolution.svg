<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="100%" height="100%">
  <defs>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
      .sub { font-size: 11.5px; fill: #64748b; }
      .code { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .tag-old { font-size: 11px; font-weight: 600; fill: #64748b; }
      .tag-new { font-size: 11px; font-weight: 600; fill: #047857; }
    </style>

    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="760" height="250" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Row: Before -->
  <rect x="24" y="18" width="712" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="38" y="34" width="96" height="44" rx="6" fill="#f1f5f9" />
  <text x="86" y="60" text-anchor="middle" class="text tag-old">改造前：手动脚本</text>

  <rect x="154" y="38" width="144" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="226" y="60" text-anchor="middle" class="text sub">微信加密 .db</text>

  <line x1="298" y1="56" x2="334" y2="56" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-gray)" />

  <rect x="338" y="38" width="164" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="420" y="60" text-anchor="middle" class="text sub">全量解密 + 全量导出</text>

  <line x1="502" y1="56" x2="538" y2="56" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arrow-gray)" />

  <rect x="542" y="38" width="174" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="629" y="60" text-anchor="middle" class="text sub">静态 Markdown（无法实时查）</text>

  <!-- Bottom Row: After -->
  <rect x="24" y="110" width="712" height="122" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" />
  <rect x="38" y="136" width="96" height="70" rx="6" fill="#d1fae5" />
  <text x="86" y="166" text-anchor="middle" class="text tag-new">改造后：三层流水线</text>
  <text x="86" y="186" text-anchor="middle" class="text sub" fill="#047857">准实时 · 可检索</text>

  <!-- Step 1 -->
  <rect x="154" y="130" width="164" height="82" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text x="236" y="158" text-anchor="middle" class="text title" fill="#065f46">① 在线热快照</text>
  <text x="236" y="180" text-anchor="middle" class="code" fill="#047857">live_snapshot.py</text>
  <text x="236" y="198" text-anchor="middle" class="text sub">只读合并 .db + WAL</text>

  <line x1="318" y1="171" x2="346" y2="171" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

  <!-- Step 2 -->
  <rect x="350" y="130" width="164" height="82" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5" />
  <text x="432" y="158" text-anchor="middle" class="text title" fill="#065f46">② 增量批次</text>
  <text x="432" y="180" text-anchor="middle" class="code" fill="#047857">50_watch.py</text>
  <text x="432" y="198" text-anchor="middle" class="text sub">仅提取新增/变更消息</text>

  <line x1="514" y1="171" x2="542" y2="171" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

  <!-- Step 3 -->
  <rect x="546" y="130" width="170" height="82" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
  <text x="631" y="158" text-anchor="middle" class="text title" fill="#1e3a8a">③ MCP 服务</text>
  <text x="631" y="180" text-anchor="middle" class="code" fill="#1d4ed8">60_mcp_server.py</text>
  <text x="631" y="198" text-anchor="middle" class="text sub" fill="#1e40af">60s 同步 + 检索工具</text>
</svg>
