<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="100%" height="100%">
  <defs>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
      .sub { font-size: 12px; fill: #64748b; }
      .code { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #475569; }
      .tag { font-size: 11px; font-weight: 600; fill: #047857; }
    </style>

    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#94a3b8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="760" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Row 1: CLI (Chapter 1) -->
  <rect x="190" y="32" width="160" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="270" y="60" text-anchor="middle" class="text title">终端命令行</text>
  <text x="270" y="80" text-anchor="middle" class="code">npm run ask</text>

  <!-- Row 2: Mobile WeChat + WeChat SDK (Chapter 2) -->
  <rect x="32" y="128" width="110" height="68" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" />
  <text x="87" y="158" text-anchor="middle" class="text title" fill="#065f46">手机微信</text>
  <text x="87" y="178" text-anchor="middle" class="text sub" fill="#047857">ClawBot</text>

  <rect x="190" y="128" width="160" height="68" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" />
  <rect x="292" y="118" width="50" height="18" rx="4" fill="#d1fae5" />
  <text x="317" y="131" text-anchor="middle" class="text tag">本章新增</text>
  <text x="270" y="158" text-anchor="middle" class="text title" fill="#065f46">微信通道</text>
  <text x="270" y="178" text-anchor="middle" class="code" fill="#047857">npm run wechat</text>

  <!-- Center: Shared Agent -->
  <rect x="410" y="70" width="164" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
  <text x="492" y="106" text-anchor="middle" class="text title" fill="#1e3a8a">个人资料助理</text>
  <text x="492" y="128" text-anchor="middle" class="text sub" fill="#3b82f6">共享 Agent + Workspace</text>

  <!-- Right: LLM API -->
  <rect x="622" y="82" width="106" height="64" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="675" y="110" text-anchor="middle" class="text title">大模型 API</text>
  <text x="675" y="130" text-anchor="middle" class="text sub">生成中文回答</text>

  <!-- Arrows -->
  <!-- Mobile <-> WeChat Channel -->
  <line x1="146" y1="162" x2="186" y2="162" stroke="#10b981" stroke-width="1.8" marker-start="url(#arrow-green)" marker-end="url(#arrow-green)" />

  <!-- CLI -> Agent -->
  <path d="M 350 64 L 382 64 L 382 102 L 406 102" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arrow-gray)" />

  <!-- WeChat Channel -> Agent -->
  <path d="M 350 162 L 382 162 L 382 126 L 406 126" fill="none" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

  <!-- Agent <-> LLM API -->
  <line x1="578" y1="114" x2="618" y2="114" stroke="#94a3b8" stroke-width="1.8" marker-start="url(#arrow-gray)" marker-end="url(#arrow-gray)" />
</svg>
