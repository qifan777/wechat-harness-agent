<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" height="100%">
  <defs>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
      .sub { font-size: 11.5px; fill: #64748b; }
      .code { font-size: 11.5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; fill: #047857; }
      .step { font-size: 11px; font-weight: 600; fill: #1d4ed8; }
    </style>

    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="760" height="220" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Column 1: MCP Server -->
  <rect x="28" y="28" width="184" height="164" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8" />
  <text x="120" y="60" text-anchor="middle" class="text title" fill="#065f46">MCP Server</text>
  <text x="120" y="82" text-anchor="middle" class="code">60_mcp_server.py</text>
  <rect x="48" y="102" width="144" height="68" rx="6" fill="#ffffff" stroke="#a7f3d0" />
  <text x="120" y="128" text-anchor="middle" class="text sub" fill="#065f46">自带工具清单</text>
  <text x="120" y="150" text-anchor="middle" class="code">name + schema</text>

  <!-- Column 2: Agent / MCPClient -->
  <rect x="288" y="28" width="184" height="164" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8" />
  <text x="380" y="60" text-anchor="middle" class="text title" fill="#1e3a8a">Agent (MCPClient)</text>
  <text x="380" y="82" text-anchor="middle" class="code" fill="#1d4ed8">listTools()</text>
  <rect x="308" y="102" width="144" height="68" rx="6" fill="#ffffff" stroke="#bfdbfe" />
  <text x="380" y="128" text-anchor="middle" class="text sub" fill="#1e40af">动态挂载 tools</text>
  <text x="380" y="150" text-anchor="middle" class="text sub">无需写死系统提示词</text>

  <!-- Column 3: LLM -->
  <rect x="548" y="28" width="184" height="164" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="640" y="60" text-anchor="middle" class="text title">大模型 (LLM)</text>
  <text x="640" y="82" text-anchor="middle" class="text sub">读取工具描述自主决策</text>
  <rect x="568" y="102" width="144" height="68" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="640" y="128" text-anchor="middle" class="text sub">按需发起</text>
  <text x="640" y="150" text-anchor="middle" class="code" fill="#1d4ed8">tool_calls</text>

  <!-- Arrows between Server and Agent -->
  <line x1="216" y1="84" x2="284" y2="84" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="250" y="74" text-anchor="middle" class="code">① tools/list</text>

  <line x1="284" y1="146" x2="216" y2="146" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="250" y="166" text-anchor="middle" class="step">③ tools/call</text>

  <!-- Arrows between Agent and LLM -->
  <line x1="476" y1="84" x2="544" y2="84" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />
  <text x="510" y="74" text-anchor="middle" class="code">② 注入 Schema</text>

  <line x1="544" y1="146" x2="476" y2="146" stroke="#3b82f6" stroke-width="1.8" marker-end="url(#arrow-blue)" />
  <text x="510" y="166" text-anchor="middle" class="step">③ 选择工具</text>
</svg>
