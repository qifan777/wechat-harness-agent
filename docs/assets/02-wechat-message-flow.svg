<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 130" width="100%" height="100%">
  <defs>
    <style>
      .text {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .title { font-size: 14px; font-weight: 600; fill: #1e293b; }
      .sub { font-size: 11.5px; fill: #64748b; }
    </style>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Card Background -->
  <rect x="0" y="0" width="760" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Step 1: Receive & Normalize -->
  <rect x="24" y="27" width="166" height="76" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="107" y="58" text-anchor="middle" class="text title">收到微信消息</text>
  <text x="107" y="80" text-anchor="middle" class="text sub">文字 / 语音转写 / 媒体链接</text>

  <line x1="190" y1="65" x2="226" y2="65" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

  <!-- Step 2: Typing -->
  <rect x="230" y="27" width="144" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="302" y="58" text-anchor="middle" class="text title" fill="#065f46">显示"正在输入"</text>
  <text x="302" y="80" text-anchor="middle" class="text sub" fill="#047857">手机顶部即时反馈</text>

  <line x1="374" y1="65" x2="410" y2="65" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

  <!-- Step 3: Call Agent -->
  <rect x="414" y="27" width="136" height="76" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
  <text x="482" y="58" text-anchor="middle" class="text title" fill="#1e3a8a">调用 Agent</text>
  <text x="482" y="80" text-anchor="middle" class="text sub" fill="#3b82f6">生成中文回答</text>

  <line x1="550" y1="65" x2="586" y2="65" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-green)" />

  <!-- Step 4: Split & Send -->
  <rect x="590" y="27" width="146" height="76" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5" />
  <text x="663" y="58" text-anchor="middle" class="text title" fill="#065f46">发回微信</text>
  <text x="663" y="80" text-anchor="middle" class="text sub" fill="#047857">超长分段 · 间隔 1.5s</text>
</svg>
