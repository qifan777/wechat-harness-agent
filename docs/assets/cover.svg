<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Noto Sans SC',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
    <defs>
        <!-- line icons, 24x24 -->
        <symbol id="i-terminal" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="16" rx="2"/>
                <polyline points="7 9 10 12 7 15"/>
                <line x1="12" y1="15" x2="17" y2="15"/>
            </g>
        </symbol>
        <symbol id="i-chat" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>
                <line x1="8.5" y1="12" x2="8.6" y2="12"/>
                <line x1="12" y1="12" x2="12.1" y2="12"/>
                <line x1="15.5" y1="12" x2="15.6" y2="12"/>
            </g>
        </symbol>
        <symbol id="i-memory" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <ellipse cx="12" cy="5.5" rx="8" ry="3"/>
                <path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13"/>
                <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
            </g>
        </symbol>
        <symbol id="i-plug" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 2v5M15 2v5"/>
                <path d="M6 7h12v4a6 6 0 0 1-12 0z"/>
                <path d="M12 17v5"/>
            </g>
        </symbol>
        <symbol id="i-search" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.5" y2="16.5"/>
            </g>
        </symbol>
        <symbol id="i-file" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 3 14 8 19 8"/>
                <line x1="9" y1="13" x2="15" y2="13"/>
                <line x1="9" y1="17" x2="13" y2="17"/>
            </g>
        </symbol>
        <symbol id="i-folder" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            </g>
        </symbol>
        <symbol id="i-sync" viewBox="0 0 24 24">
            <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12a9 9 0 0 1-15.5 6.2"/>
                <path d="M3 12a9 9 0 0 1 15.5-6.2"/>
                <polyline points="18.5 2 18.5 6 14.5 6"/>
                <polyline points="5.5 22 5.5 18 9.5 18"/>
            </g>
        </symbol>
    </defs>

    <rect width="1200" height="680" fill="#faf8f5"/>

    <!-- left: title -->
    <text x="80" y="104" font-size="18" fill="#8a857c" letter-spacing="2">教程项目 · 共 4 章</text>
    <text x="80" y="180" font-size="62" font-weight="700" fill="#1f2328">微信个人</text>
    <text x="80" y="256" font-size="62" font-weight="700" fill="#1f2328">Agent 助理</text>
    <rect x="82" y="280" width="56" height="4" fill="#07C160"/>
    <text x="80" y="326" font-size="21" fill="#57534e">在微信里发一句话，</text>
    <text x="80" y="356" font-size="21" fill="#57534e">电脑上的助理去查聊天记录、整理待办。</text>

    <!-- capability chips -->
    <g>
        <rect x="80" y="392" width="132" height="38" rx="19" fill="#ffffff" stroke="#e5e1da" stroke-width="1.5"/>
        <use href="#i-search" x="94" y="401" width="20" height="20" color="#1a7f4b"/>
        <text x="120" y="417" font-size="15" fill="#1f2328">查聊天记录</text>

        <rect x="224" y="392" width="132" height="38" rx="19" fill="#ffffff" stroke="#e5e1da" stroke-width="1.5"/>
        <use href="#i-file" x="238" y="401" width="20" height="20" color="#1a7f4b"/>
        <text x="264" y="417" font-size="15" fill="#1f2328">读本地资料</text>

        <rect x="368" y="392" width="132" height="38" rx="19" fill="#ffffff" stroke="#e5e1da" stroke-width="1.5"/>
        <use href="#i-folder" x="382" y="401" width="20" height="20" color="#1a7f4b"/>
        <text x="408" y="417" font-size="15" fill="#1f2328">存成文档</text>
    </g>

    <!-- right: chat card (WeChat-like) -->
    <rect x="660" y="60" width="460" height="380" rx="16" fill="#ededed" stroke="#ddd8ce" stroke-width="1.5"/>
    <path d="M690 72 L682 82 L690 92" fill="none" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="890" y="88" font-size="16" font-weight="700" fill="#1f2328" text-anchor="middle">微信 ClawBot</text>
    <rect x="948" y="74" width="26" height="16" rx="3" fill="#c9c9c9"/>
    <text x="961" y="86" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">AI</text>
    <line x1="661" y1="104" x2="1119" y2="104" stroke="#dcdcdc" stroke-width="1.5"/>

    <!-- user bubble -->
    <rect x="788" y="118" width="312" height="42" rx="8" fill="#95ec69"/>
    <text x="804" y="144" font-size="15" fill="#1f2328">帮我看一下产品发布群最近一周聊了什么</text>

    <!-- tool status pill -->
    <rect x="680" y="170" width="236" height="24" rx="12" fill="#dedbd4"/>
    <use href="#i-sync" x="692" y="175" width="14" height="14" color="#57534e"/>
    <text x="712" y="187" font-size="12" fill="#57534e">已同步最新消息 · 搜索聊天记录</text>

    <!-- assistant bubble -->
    <rect x="680" y="204" width="410" height="216" rx="8" fill="#ffffff"/>
    <text x="696" y="232" font-size="14" fill="#1f2328">看了「产品发布群」最近一周的聊天，</text>
    <text x="696" y="254" font-size="14" fill="#1f2328">主要是<tspan font-weight="700">AI 工具交流、需求评审和日常闲聊</tspan>。</text>

    <text x="696" y="284" font-size="14" font-weight="700" fill="#1f2328">1. AI 工具是比较集中的话题</text>
    <circle cx="716" cy="303" r="2" fill="#57534e"/>
    <text x="728" y="308" font-size="14" fill="#1f2328">11月3日：分享用 Claude 写文档的体验</text>
    <circle cx="716" cy="325" r="2" fill="#57534e"/>
    <text x="728" y="330" font-size="14" fill="#1f2328">11月4日：讨论订阅额度和账号稳定性</text>

    <text x="696" y="360" font-size="14" font-weight="700" fill="#1f2328">2. 需求评审与排期</text>
    <circle cx="716" cy="379" r="2" fill="#57534e"/>
    <text x="728" y="384" font-size="14" fill="#1f2328">前端改动有方案，文档要保持一致</text>
    <circle cx="716" cy="401" r="2" fill="#57534e"/>
    <text x="728" y="406" font-size="14" fill="#1f2328">上线时间尚未确定</text>

    <!-- bottom: four chapter cards -->
    <g>
        <rect x="80" y="476" width="245" height="150" rx="14" fill="#ffffff" stroke="#e5e1da" stroke-width="1.5"/>
        <rect x="100" y="496" width="46" height="46" rx="11" fill="#e7f6ed"/>
        <use href="#i-terminal" x="111" y="507" width="24" height="24" color="#1a7f4b"/>
        <text x="305" y="526" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="end">01</text>
        <text x="100" y="578" font-size="19" font-weight="700" fill="#1f2328">创建第一个 Agent</text>
        <text x="100" y="604" font-size="14" fill="#8a857c">Mastra + 模型 API</text>

        <rect x="345" y="476" width="245" height="150" rx="14" fill="#ffffff" stroke="#e5e1da" stroke-width="1.5"/>
        <rect x="365" y="496" width="46" height="46" rx="11" fill="#e7f6ed"/>
        <use href="#i-chat" x="376" y="507" width="24" height="24" color="#1a7f4b"/>
        <text x="570" y="526" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="end">02</text>
        <text x="365" y="578" font-size="19" font-weight="700" fill="#1f2328">在微信里使用它</text>
        <text x="365" y="604" font-size="14" fill="#8a857c">扫码关联，分段回复</text>

        <rect x="610" y="476" width="245" height="150" rx="14" fill="#ffffff" stroke="#e5e1da" stroke-width="1.5"/>
        <rect x="630" y="496" width="46" height="46" rx="11" fill="#e7f6ed"/>
        <use href="#i-memory" x="641" y="507" width="24" height="24" color="#1a7f4b"/>
        <text x="835" y="526" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="end">03</text>
        <text x="630" y="578" font-size="19" font-weight="700" fill="#1f2328">记住对话和偏好</text>
        <text x="630" y="604" font-size="14" fill="#8a857c">多轮追问，长期偏好</text>

        <rect x="875" y="476" width="245" height="150" rx="14" fill="#ffffff" stroke="#e5e1da" stroke-width="1.5"/>
        <rect x="895" y="496" width="46" height="46" rx="11" fill="#e7f6ed"/>
        <use href="#i-plug" x="906" y="507" width="24" height="24" color="#1a7f4b"/>
        <text x="1100" y="526" font-size="15" font-weight="700" fill="#1a7f4b" text-anchor="end">04</text>
        <text x="895" y="578" font-size="19" font-weight="700" fill="#1f2328">接入聊天记录 MCP</text>
        <text x="895" y="604" font-size="14" fill="#8a857c">增量同步，搜索总结</text>
    </g>

    <!-- chevrons between cards -->
    <g fill="none" stroke="#bdb7ab" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M331 544 L338 551 L331 558"/>
        <path d="M596 544 L603 551 L596 558"/>
        <path d="M861 544 L868 551 L861 558"/>
    </g>
</svg>